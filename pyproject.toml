[project]
name = "rag-customer-service"
version = "0.1.0"
description = "RAG 智能客服系统：Streamlit + LangGraph + Chroma，支持 OpenAI/Ollama/Xinference"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.30",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-ollama>=0.2",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "chromadb>=0.5",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_cs"]

# ruff / mypy 配置与 .claude/rules/code-style.md 一致
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 中文项目：docstring/注释/字符串中的全角标点（，：；（）等）是正常书写，
# 不视为与 ASCII 标点混淆的歧义，关闭 RUF001/002/003。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
# 目标 3.12：传递依赖（chromadb -> numpy）的 stub 使用 PEP 695 type 语句，
# mypy 在 3.11 目标下无法解析。
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
